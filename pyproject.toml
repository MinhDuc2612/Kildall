[project]
name = "kildall"
version = "0.1.0"
license = "MIT"
description = "Local terminal assistant with bounded project memory"
requires-python = ">=3.12,<3.13"
dependencies = ["mlx-lm==0.31.3", "numpy==2.5.2", "PyYAML==6.0.3"]

[project.scripts]
kildall = "kildall:main"
orbi = "kildall:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kildall", "orbi", "memory", "tool_validation", "routing", "skill_catalog", "permissions", "tool_grammar", "tool_runtime", "file_tools", "shell_tools", "image_reader", "git_tools", "instruction_skills", "hooks", "subagents"]
