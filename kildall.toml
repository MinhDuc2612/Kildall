# Kildall Phase 1. Relative paths are relative to this code directory.
[paths]
code_dir = "."
model_dir = "models"
db_path = "kildall.db"
backup_dir = "../backups" # Phase 1 backups and markdown mirrors live outside code/.

# Phase 1 runtime retained; Lane A is provisional after the DWQ exact-argument retest.
# Four original gates passed, but exact arguments remain 18/20; see BENCHMARKS.md.
[lanes.a]
# Ranked: Qwen3.8-Flash-Next, Qwen3.8-27B + CMoE, Gemma 4 26B-A4B, Granite 4.1 8B.
model = "models/gemma-4-26b-a4b/gemma-4-26B-A4B-it-UD-IQ3_S.gguf"

[lanes.b]
# Specialists: canary-qwen-2.5b, Qwen3-ASR-1.7B, Qwen3-TTS-12Hz-1.7B,
# Qwen3-Omni-30B-A3B, PaddleOCR-VL-1.6, Harrier-oss-v1-27B,
# Qwen3-Reranker-4B, Harrier-oss-v1-0.6B, granite-guardian-4.1-8b,
# MiLMMT-46-12B, Qwen-Image-2512, Wan 2.7, Hunyuan3D-2.1, Molmo2-8B.
# Phase 5 revisits Wan 3.0 and Hunyuan3D v3; Omni cannot co-load with Lane A.
model = ""

[lanes.c]
# Kimi-K3, Qwen3.8-2.4T-A95B, DeepSeek-V4-Pro-0813, GLM-5.2,
# GLM-5.3, GLM-5.3-Flash, DeepSeek-V4-Flash-0731. Parked until the external drive exists.
model = ""

[budget]
monthly = 0 # Local and free tiers only.

[memory]
max_items = 12
max_chars = 4000
max_ms = 300

# Small semantic retrieval model; the 27B reranker path is not resident.
embedding_model = "models/harrier/harrier-oss-v1-0.6B-Q4_K_M.gguf"

[runtime]
server = ".tools/llama-b10809/llama-b10809/llama-server"
port = 8123
embedding_port = 8124
context_size = 4096
parallel = 3 # Routing candidate B: router0/work1-2; total12288, 4096 per slot.

[cloud]
enabled = true

# Ordered exact free-access IDs. Quotas and data policies remain unverified.
# Anonymous LLM7 chat returned200 on2026-10-07; current docs say token required.
[cloud.providers.llm7]
base_url = "https://api.llm7.io/v1"
key_name = "LLM7_API_KEY"
keyless = true
allowed_models = ["codestral-latest"]
context_tokens = 32000
daily_tokens = 100000
quota_window = "rolling_24h"
requests_per_minute = 60
requests_per_hour = 250
min_interval_seconds = 1
limits_status = "unverified"
limits_source = "https://docs.llm7.io/limits (Cloudcall daily limit unspecified)"
trains_on_data = "unknown"

# Anonymous only: never attach an authenticated, billed OVH account.
[cloud.providers.ovh]
base_url = "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
key_name = ""
keyless = true
allowed_models = ["gpt-oss-20b"]
context_tokens = 131072
daily_requests = 0 # undocumented, not an unlimited-service claim
requests_per_minute = 2
limits_status = "unverified"
limits_source = "Researchhub/sample3/Cloudcall/ovhcloudccapi.md; official anonymous access 2 RPM"
trains_on_data = false

[cloud.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
key_name = "OPENROUTER_API_KEY"
allowed_models = ["nvidia/nemotron-3-super-120b-a12b:free", "nvidia/nemotron-3-ultra-550b-a55b:free", "poolside/laguna-s-2.1:free", "cohere/north-mini-code:free"]
context_tokens = 32000 # conservative client ceiling
daily_requests = 50
quota_window = "utc_day"
requests_per_minute = 20
limits_status = "unverified"
limits_source = "Researchhub/sample3/Cloudcall/freellmapiccapi.md"
trains_on_data = true
